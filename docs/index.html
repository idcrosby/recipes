---
layout: default
---
<header class="hero">
  <div>
    <h1>The recipe<br>collection<span>.</span></h1>
    <p>Straight Bangers. And Mash.</p>
  </div>
</header>

<section class="collection" aria-labelledby="collection-title">
  <h2 id="collection-title">Browse recipes</h2>
  <div class="collection-tools" hidden>
    <label for="recipe-search">Search by recipe name or ingredient</label>
    <input id="recipe-search" type="search" placeholder="Try chickpeas or pancakes" aria-controls="recipe-grid">
    <fieldset class="filters">
      <legend class="visually-hidden">Recipe category</legend>
      <button class="button" type="button" data-category="" aria-pressed="true">All recipes</button>
      {% for category in site.data.recipe_categories %}
        <button class="button" type="button" data-category="{{ category.id }}" aria-pressed="false">{{ category.label | escape }}</button>
      {% endfor %}
    </fieldset>
    <p class="result-count" role="status" aria-live="polite"></p>
  </div>
  <noscript>
    <p>Browse by category.
      <a href="{{ '/meals/' | relative_url }}">Mains</a> ·
      <a href="{{ '/baking/' | relative_url }}">Baking</a> ·
      <a href="{{ '/veggie/' | relative_url }}">Veggie</a> ·
      <a href="{{ '/moms/' | relative_url }}">Mom’s</a>
    </p>
  </noscript>
  {% include recipe-grid.html search=true %}
  <p class="empty-state" hidden>No recipes match. Try a different search or category.</p>
</section>
