<!doctype html>
<html lang="en">
{% include head.html %}
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="shell site-navigation">
      <a class="wordmark" href="{{ '/' | relative_url }}">Recipes<span>.</span></a>
      <nav aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Collection</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
      </nav>
    </div>
  </header>
  <main id="main" class="shell">{{ content }}</main>
  <footer class="site-footer shell">
    <a class="wordmark" href="{{ '/' | relative_url }}">Recipes<span>.</span></a>
    <a href="https://github.com/idcrosby/recipes">View on GitHub ↗</a>
  </footer>
</body>
</html>
