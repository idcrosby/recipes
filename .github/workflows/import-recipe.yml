name: Import recipe from URL

on:
  workflow_dispatch:
    inputs:
      url:
        description: Public HTTPS recipe URL
        required: true
        type: string
      category:
        description: Cookbook category
        default: Meals
        type: choice
        options:
          - Meals
          - Baking
          - Veg
          - Breakfast
          - Sides
          - Snacks
          - Mom

permissions:
  contents: write
  pull-requests: write

jobs:
  draft-recipe:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Import and commit recipe
        env:
          RECIPE_URL: ${{ inputs.url }}
          RECIPE_CATEGORY: ${{ inputs.category }}
          BRANCH: recipe-import/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          recipe="$(python3 scripts/import_recipe.py --category "$RECIPE_CATEGORY" -- "$RECIPE_URL")"
          git switch -c "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$recipe"
          git commit -m "Import recipe from URL"
          git push origin "$BRANCH"

      - name: Open recipe review
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
          BRANCH: recipe-import/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if review_url="$(gh pr create --base "$BASE" --head "$BRANCH" --draft \
            --title "Review imported recipe" \
            --body "Check the imported ingredients and instructions against the linked source before publishing.")"; then
            echo "[Review the imported recipe]($review_url)" >> "$GITHUB_STEP_SUMMARY"
          else
            compare_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$BASE...$BRANCH?expand=1"
            echo "[Open a pull request for the imported recipe]($compare_url)" >> "$GITHUB_STEP_SUMMARY"
            echo "GitHub did not create the pull request automatically. The branch is available for review." >> "$GITHUB_STEP_SUMMARY"
          fi
